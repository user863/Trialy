<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1420" viewBox="0 0 1440 1420" fill="none"><rect id="Background" width="1440" height="1420" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" id="Navigation"/><rect x="0" y="64" width="1440" height="1" rx="0" fill="#3C4043" opacity="0.3" id="Nav shadow 1"/><rect x="0" y="65" width="1440" height="2" rx="0" fill="#3C4043" opacity="0.1" id="Nav shadow 2"/><g id="Logo"><rect x="120" y="20" width="24" height="24" rx="8" fill="#20BEFF" id="Logo mark"/><text font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start" id="Brand name"><tspan x="152" y="37">TrialBase</tspan></text></g><g id="Nav links"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Nav link Trials"><tspan x="268" y="37">Trials</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Nav link My answers"><tspan x="336" y="37">My answers</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Nav link Shortlist"><tspan x="434" y="37">Shortlist</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Nav link Privacy"><tspan x="524" y="37">Privacy</tspan></text></g><g id="Nav actions"><circle cx="1166" cy="32" r="18" fill="none" stroke="#BDC1C6" stroke-width="1" id="Theme button"/><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="middle" id="Theme glyph"><tspan x="1166" y="37">◐</tspan></text><circle cx="1212" cy="32" r="18" fill="none" stroke="#BDC1C6" stroke-width="1" id="Text size button"/><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="middle" id="Text size glyph"><tspan x="1212" y="37">A+</tspan></text><g id="Start button"><rect x="1240" y="14" width="80" height="36" rx="20" fill="#202124" stroke="#202124" stroke-width="1" id="Start button shape"/><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" id="Start button label"><tspan x="1280.0" y="37.5">Start</tspan></text></g></g><g id="Hero copy"><text font-family="Inter, sans-serif" font-size="40" font-weight="700" fill="#202124" text-anchor="start" id="Headline"><tspan x="120" y="150">Find clinical trials</tspan><tspan x="120" y="198">that fit your</tspan><tspan x="120" y="246">condition.</tspan></text><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#3C4043" text-anchor="start" id="Lead"><tspan x="120" y="316">Tell us your diagnosis and see which</tspan><tspan x="120" y="340">recruiting trials in Germany and its</tspan><tspan x="120" y="364">neighbouring countries you may qualify</tspan><tspan x="120" y="388">for, criterion by criterion.</tspan></text><g id="Continue button"><rect x="120" y="436" width="236" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Continue button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="middle" id="Continue button label"><tspan x="238.0" y="463.5">Continue with my results</tspan></text></g></g><g id="Condition search card"><rect x="634" y="104" width="686" height="426" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card shape"/><text font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#202124" text-anchor="start" id="Card title"><tspan x="658" y="160">Search by your condition</tspan></text><g id="Condition field"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Condition field label"><tspan x="658" y="196">Condition</tspan></text><rect x="658" y="208" width="638" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Condition field box"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Condition field value"><tspan x="674" y="236">Non-small cell lung cancer</tspan></text><path id="Condition field chevron" d="M1264 227 l6 6 l6 -6" stroke="#202124" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g id="Stage field"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Stage field label"><tspan x="658" y="276">Stage</tspan></text><rect x="658" y="288" width="307" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Stage field box"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Stage field value"><tspan x="674" y="316">Stage IV</tspan></text><path id="Stage field chevron" d="M933 307 l6 6 l6 -6" stroke="#202124" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g id="Country field"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Country field label"><tspan x="989" y="276">Country</tspan></text><rect x="989" y="288" width="307" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Country field box"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Country field value"><tspan x="1005" y="316">Germany</tspan></text><path id="Country field chevron" d="M1264 307 l6 6 l6 -6" stroke="#202124" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Postcode label"><tspan x="658" y="356">Postcode, for distances</tspan></text><rect x="658" y="368" width="638" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Postcode field"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Postcode value"><tspan x="674" y="396">10115</tspan></text><g id="Search button"><rect x="658" y="436" width="220" height="44" rx="20" fill="#202124" stroke="#202124" stroke-width="1" id="Search button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" id="Search button label"><tspan x="768.0" y="463.5">Show matching trials</tspan></text></g><g id="Questions button"><rect x="890" y="436" width="208" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Questions button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="middle" id="Questions button label"><tspan x="994.0" y="463.5">Answer all questions</tspan></text></g><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Search note"><tspan x="658" y="500">328 recruiting lung cancer trials searched in your browser. Your answers never leave this device.</tspan></text></g><g id="Preview copy"><text font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#202124" text-anchor="start" id="Section title"><tspan x="120" y="646">See exactly why a trial fits.</tspan></text><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#3C4043" text-anchor="start" id="Section lead"><tspan x="120" y="694">Each study lists its inclusion and exclusion criteria</tspan><tspan x="120" y="718">separately. Criteria you fulfil are marked, so you can see</tspan><tspan x="120" y="742">at a glance what is left to discuss with your doctor.</tspan></text><g id="Browse button"><rect x="120" y="794" width="168" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Browse button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="middle" id="Browse button label"><tspan x="204.0" y="821.5">Browse all trials</tspan></text></g></g><clipPath id="plate-clip"><rect x="732" y="618" width="588" height="436" rx="16"/></clipPath><g id="Preview plate"><rect x="732" y="618" width="588" height="436" rx="16" fill="#E8EAED" id="Plate"/><g clip-path="url(#plate-clip)"><circle cx="1296" cy="650" r="140" fill="#1CCD76" id="Blob"/><path id="UI panel" d="M772 674 a16 16 0 0 1 16 -16 h492 a16 16 0 0 1 16 16 V1054 H772 Z" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><g id="Recruiting pill"><rect x="796" y="682" width="148" height="24" rx="100" fill="#202124" stroke="#202124" stroke-width="1" id="Recruiting pill shape"/><text font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" id="Recruiting pill label"><tspan x="870.0" y="698">Recruiting · 7 sites</tspan></text></g><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Trial title"><tspan x="796" y="736">Novel Approach to Radiotherapy in Locally</tspan><tspan x="796" y="760">Advanced Lung Cancer Concomitant Navelbine®</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Trial meta"><tspan x="796" y="788">3 of 15 criteria fulfilled</tspan></text><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Inclusion title"><tspan x="796" y="830">Inclusion criteria</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="end" id="Inclusion count"><tspan x="1272" y="830">3 of 8 fulfilled</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Inclusion note"><tspan x="796" y="850">You need to meet these.</tspan></text><g id="Criteria list"><rect x="796" y="866" width="476" height="190" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="List frame"/><g id="Criterion 1"><g id="Marker fulfilled 894"><circle cx="824" cy="894" r="12" fill="#202124" stroke="#202124" stroke-width="1"/><path d="M819.5 894.5 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Criterion 1 text"><tspan x="856" y="894">Registry age limits: 18 Years to no maximum</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Criterion 1 meta"><tspan x="856" y="914">You said: 62 years</tspan></text></g><rect x="796" y="930" width="476" height="1" rx="0" fill="#DADCE0" id="Divider 1"/><g id="Criterion 2"><g id="Marker fulfilled 958"><circle cx="824" cy="958" r="12" fill="#202124" stroke="#202124" stroke-width="1"/><path d="M819.5 958.5 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Criterion 2 text"><tspan x="856" y="958">Registry conditions: NSCLC</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Criterion 2 meta"><tspan x="856" y="978">You said: non-small cell lung cancer</tspan></text></g><rect x="796" y="994" width="476" height="1" rx="0" fill="#DADCE0" id="Divider 2"/><g id="Criterion 3"><g id="Marker open 1022"><circle cx="824" cy="1022" r="12" fill="none" stroke="#BDC1C6" stroke-width="1"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start" id="Criterion 3 text"><tspan x="856" y="1022">Provision of signed, written and dated consent</tspan></text></g></g></g></g><g id="Feature card 1"><rect x="120" y="1118" width="384" height="140" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card 1 shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Card 1 title"><tspan x="144" y="1162">Private by design</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#3C4043" text-anchor="start" id="Card 1 body"><tspan x="144" y="1190">Your answers stay in this browser. There</tspan><tspan x="144" y="1210">are no accounts and no tracking, and</tspan><tspan x="144" y="1230">matching runs on your device.</tspan></text></g><g id="Feature card 2"><rect x="528" y="1118" width="384" height="140" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card 2 shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Card 2 title"><tspan x="552" y="1162">Every criterion explained</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#3C4043" text-anchor="start" id="Card 2 body"><tspan x="552" y="1190">Inclusion and exclusion criteria are listed</tspan><tspan x="552" y="1210">with the registry's own wording. Fulfilled</tspan><tspan x="552" y="1230">ones are marked, nothing is hidden.</tspan></text></g><g id="Feature card 3"><rect x="936" y="1118" width="384" height="140" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card 3 shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Card 3 title"><tspan x="960" y="1162">Recruiting first</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#3C4043" text-anchor="start" id="Card 3 body"><tspan x="960" y="1190">Trials with a site that says it is recruiting</tspan><tspan x="960" y="1210">come first, sorted by distance. Others stay</tspan><tspan x="960" y="1230">visible, clearly labelled.</tspan></text></g><rect x="120" y="1322" width="1200" height="1" rx="0" fill="#DADCE0" id="Footer rule"/><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start" id="Footer text"><tspan x="120" y="1362">Information service about clinical trials, not medical advice. Always talk to your treating team. Data: ClinicalTrials.gov. Prototype, English only.</tspan></text></svg>