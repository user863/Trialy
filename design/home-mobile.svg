<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2110" viewBox="0 0 390 2110" fill="none"><rect id="Background" width="390" height="2110" fill="#FFFFFF"/><rect x="0" y="0" width="390" height="64" rx="0" fill="#FFFFFF" id="Navigation"/><rect x="0" y="64" width="390" height="1" rx="0" fill="#3C4043" opacity="0.3" id="Nav shadow 1"/><rect x="0" y="65" width="390" height="2" rx="0" fill="#3C4043" opacity="0.1" id="Nav shadow 2"/><g id="Logo"><rect x="24" y="20" width="24" height="24" rx="8" fill="#226DC3" id="Logo mark"/><text font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#202124" text-anchor="start" id="Brand name"><tspan x="56" y="37">TrialBase</tspan></text></g><g id="Nav actions"><circle cx="216" cy="32" r="18" fill="none" stroke="#BDC1C6" stroke-width="1" id="Theme button"/><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="middle" id="Theme glyph"><tspan x="216" y="37">◐</tspan></text><circle cx="262" cy="32" r="18" fill="none" stroke="#BDC1C6" stroke-width="1" id="Text size button"/><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="middle" id="Text size glyph"><tspan x="262" y="37">A+</tspan></text><g id="Start button"><rect x="286" y="14" width="80" height="36" rx="20" fill="#202124" stroke="#202124" stroke-width="1" id="Start button shape"/><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle" id="Start button label"><tspan x="326.0" y="37.5">Start</tspan></text></g></g><g id="Hero copy"><text font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#202124" text-anchor="start" id="Headline"><tspan x="24" y="140">Find clinical</tspan><tspan x="24" y="180">trials that fit</tspan><tspan x="24" y="220">your condition.</tspan></text><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#3C4043" text-anchor="start" id="Lead"><tspan x="24" y="284">Tell us your diagnosis and see which</tspan><tspan x="24" y="308">recruiting trials in Germany and its</tspan><tspan x="24" y="332">neighbouring countries you may qualify</tspan><tspan x="24" y="356">for, criterion by criterion.</tspan></text></g><g id="Condition search card"><rect x="24" y="392" width="342" height="582" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card shape"/><text font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#202124" text-anchor="start" id="Card title"><tspan x="48" y="448">Search by your condition</tspan></text><g id="Condition field"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Condition field label"><tspan x="48" y="484">Condition</tspan></text><rect x="48" y="496" width="294" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Condition field box"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Condition field value"><tspan x="64" y="524">Non-small cell lung cancer</tspan></text><path id="Condition field chevron" d="M310 515 l6 6 l6 -6" stroke="#202124" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g id="Stage field"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Stage field label"><tspan x="48" y="560">Stage</tspan></text><rect x="48" y="572" width="294" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Stage field box"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Stage field value"><tspan x="64" y="600">Stage IV</tspan></text><path id="Stage field chevron" d="M310 591 l6 6 l6 -6" stroke="#202124" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g id="Country field"><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Country field label"><tspan x="48" y="636">Country</tspan></text><rect x="48" y="648" width="294" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Country field box"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Country field value"><tspan x="64" y="676">Germany</tspan></text><path id="Country field chevron" d="M310 667 l6 6 l6 -6" stroke="#202124" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#202124" text-anchor="start" id="Postcode label"><tspan x="48" y="712">Postcode, for distances</tspan></text><rect x="48" y="724" width="294" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Postcode field"/><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#202124" text-anchor="start" id="Postcode value"><tspan x="64" y="752">10115</tspan></text><g id="Search button"><rect x="48" y="792" width="294" height="44" rx="20" fill="#202124" stroke="#202124" stroke-width="1" id="Search button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle" id="Search button label"><tspan x="195.0" y="819.5">Show matching trials</tspan></text></g><g id="Questions button"><rect x="48" y="848" width="294" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Questions button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="middle" id="Questions button label"><tspan x="195.0" y="875.5">Answer all questions</tspan></text></g><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Search note"><tspan x="48" y="916">328 recruiting lung cancer trials</tspan><tspan x="48" y="932">searched in your browser. Your answers</tspan><tspan x="48" y="948">never leave this device.</tspan></text></g><g id="Preview copy"><text font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#202124" text-anchor="start" id="Section title"><tspan x="24" y="1066">See exactly why a</tspan><tspan x="24" y="1098">trial fits.</tspan></text><text font-family="Inter, sans-serif" font-size="16" font-weight="400" fill="#3C4043" text-anchor="start" id="Section lead"><tspan x="24" y="1134">Each study lists its inclusion and</tspan><tspan x="24" y="1158">exclusion criteria separately. Criteria</tspan><tspan x="24" y="1182">you fulfil are marked, so you can see at</tspan><tspan x="24" y="1206">a glance what is left to discuss.</tspan></text><g id="Browse button"><rect x="24" y="1250" width="168" height="44" rx="20" fill="none" stroke="#BDC1C6" stroke-width="1" id="Browse button shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="middle" id="Browse button label"><tspan x="108.0" y="1277.5">Browse all trials</tspan></text></g></g><clipPath id="plate-clip"><rect x="24" y="1322" width="342" height="253" rx="16"/></clipPath><g id="Preview plate"><rect x="24" y="1322" width="342" height="253" rx="16" fill="#E8EAED" id="Plate"/><g clip-path="url(#plate-clip)"><circle cx="350" cy="1342" r="90" fill="#1CCD76" id="Blob"/><path id="UI panel" d="M48 1362 a16 16 0 0 1 16 -16 h270 a16 16 0 0 1 16 16 V1575 H48 Z" fill="#FFFFFF" stroke="#DADCE0" stroke-width="1"/><g id="Recruiting pill"><rect x="64" y="1362" width="148" height="24" rx="100" fill="#E6F4EA" stroke="#E6F4EA" stroke-width="1" id="Recruiting pill shape"/><text font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#137333" text-anchor="middle" id="Recruiting pill label"><tspan x="144.0" y="1378">Recruiting · 7 sites</tspan></text></g><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Trial title"><tspan x="64" y="1414">Novel Approach to Radiotherapy in</tspan><tspan x="64" y="1438">Locally Advanced Lung Cancer</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Trial meta"><tspan x="64" y="1466">3 of 15 criteria fulfilled</tspan></text><g id="Criteria list"><rect x="64" y="1486" width="270" height="150" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="List frame"/><g id="Criterion 1"><g id="Marker fulfilled 1514"><circle cx="92" cy="1514" r="12" fill="#202124" stroke="#202124" stroke-width="1"/><path d="M87.5 1514.5 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Criterion 1 text"><tspan x="124" y="1514">Registry age limits: 18 Years</tspan></text><text font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#5F6368" text-anchor="start" id="Criterion 1 meta"><tspan x="124" y="1534">You said: 62 years</tspan></text></g><rect x="64" y="1550" width="270" height="1" rx="0" fill="#DADCE0" id="Divider 1"/><g id="Criterion 2"><g id="Marker fulfilled 1578"><circle cx="92" cy="1578" r="12" fill="#202124" stroke="#202124" stroke-width="1"/><path d="M87.5 1578.5 l3 3 l6 -7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#3C4043" text-anchor="start" id="Criterion 2 text"><tspan x="124" y="1578">Registry conditions: NSCLC</tspan></text></g></g></g></g><g id="Feature card 1"><rect x="24" y="1639" width="342" height="140" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card 1 shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Card 1 title"><tspan x="48" y="1683">Private by design</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#3C4043" text-anchor="start" id="Card 1 body"><tspan x="48" y="1711">Your answers stay on this device. There</tspan><tspan x="48" y="1731">are no accounts and no tracking, and</tspan><tspan x="48" y="1751">matching runs on your phone.</tspan></text></g><g id="Feature card 2"><rect x="24" y="1803" width="342" height="140" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card 2 shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Card 2 title"><tspan x="48" y="1847">Every criterion explained</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#3C4043" text-anchor="start" id="Card 2 body"><tspan x="48" y="1875">Inclusion and exclusion criteria are listed</tspan><tspan x="48" y="1895">with the registry's own wording. Fulfilled</tspan><tspan x="48" y="1915">ones are marked, nothing is hidden.</tspan></text></g><g id="Feature card 3"><rect x="24" y="1967" width="342" height="140" rx="16" fill="none" stroke="#DADCE0" stroke-width="1" id="Card 3 shape"/><text font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#202124" text-anchor="start" id="Card 3 title"><tspan x="48" y="2011">Recruiting first</tspan></text><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#3C4043" text-anchor="start" id="Card 3 body"><tspan x="48" y="2039">Trials with a site that says it is recruiting</tspan><tspan x="48" y="2059">come first, sorted by distance. Others stay</tspan><tspan x="48" y="2079">visible, clearly labelled.</tspan></text></g><rect x="24" y="2155" width="342" height="1" rx="0" fill="#DADCE0" id="Footer rule"/><text font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#5F6368" text-anchor="start" id="Footer text"><tspan x="24" y="2187">Information service about clinical trials,</tspan><tspan x="24" y="2207">not medical advice. Always talk to your</tspan><tspan x="24" y="2227">treating team. Data: ClinicalTrials.gov.</tspan></text></svg>